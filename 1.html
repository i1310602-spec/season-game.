<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>四季連擊點擊遊戲</title>
<style>
body {
    margin: 0;
    font-family: "Microsoft JhengHei", sans-serif;
    text-align: center;
    transition: background 0.5s;
}
#seasonTitle {
    font-size: 32px;
    margin: 10px 0;
}
#fullscreenBtn {
    font-size: 16px;
    padding: 6px 14px;
    cursor: pointer;
}
#gameArea {
    margin: 10px auto;
    width: 90vmin;
    height: 90vmin;
    max-width: 520px;
    max-height: 520px;
    position: relative;
    border-radius: 20px;
    background: rgba(255,255,255,0.4);
}
.target {
    width: 14vmin;
    height: 14vmin;
    max-width: 100px;
    max-height: 100px;
    min-width: 70px;
    min-height: 70px;
    border-radius: 50%;
    position: absolute;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 6vmin;
    user-select: none;
}
.normal { background: rgba(255,255,255,0.85); }
.bonus { background: gold; }
.penalty { background: #ff6b6b; }
#info {
    font-size: 20px;
    margin-bottom: 10px;
}
#startMessage {
    font-size: 24px;
    color: #333;
    margin: 20px;
}
</style>
</head>

<body>

<div id="seasonTitle"></div>
<button id="fullscreenBtn">🔲 放大遊戲區</button>

<div id="gameArea"></div>

<div id="info">
    分數：<span id="score">0</span>
    ｜ 連擊：<span id="combo">0</span>
    ｜ 剩餘時間：<span id="time">10</span> 秒
</div>

<div id="startMessage">按空白鍵開始遊戲</div>

<script>
/* 音效 */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);
    o.stop(audioCtx.currentTime + 0.12);
}

/* 四季資料 */
const seasons = [
    { name: "🌸 春天", bg: "#E8F5E9", items: ["🌱","🌸","🐝"] },
    { name: "☀️ 夏天", bg: "#FFFDE7", items: ["🍉","🍦","🌞"] },
    { name: "🍁 秋天", bg: "#FFF3E0", items: ["🌾","🍂","🎃"] },
    { name: "❄️ 冬天", bg: "#E3F2FD", items: ["⛄","❄️","🧤"] }
];

let seasonIndex = 0;
let score = 0;
let combo = 0;
let timeLeft = 10;
let gameStarted = false;

const title = document.getElementById("seasonTitle");
const gameArea = document.getElementById("gameArea");
const scoreSpan = document.getElementById("score");
const comboSpan = document.getElementById("combo");
const timeSpan = document.getElementById("time");
const fsBtn = document.getElementById("fullscreenBtn");
const startMsg = document.getElementById("startMessage");

/* 放大可點區 */
fsBtn.onclick = () => {
    gameArea.style.width = "95vmin";
    gameArea.style.height = "95vmin";
};

/* 隨機位置 */
function randomPos(el) {
    const size = el.offsetWidth;
    el.style.left = Math.random() * (gameArea.clientWidth - size) + "px";
    el.style.top  = Math.random() * (gameArea.clientHeight - size) + "px";
}

/* 建立物件 */
function createTarget() {
    if (!gameStarted) return;

    const t = document.createElement("div");
    t.className = "target normal";

    let pts = 0;
    let sound = 500;

    const r = Math.random();
    if (r < 0.15) {
        t.className = "target bonus";
        t.textContent = "⭐";
        pts = 3;
        sound = 900;
        t.dataset.correct = "true";
    } else if (r < 0.25) {
        t.className = "target penalty";
        t.textContent = "💣";
        pts = -2;
        sound = 200;
        t.dataset.correct = "true";
    } else {
        const isCorrect = Math.random() < 0.6;
        const seasonForItem = isCorrect ? seasonIndex : Math.floor(Math.random() * seasons.length);
        t.dataset.correct = (seasonForItem === seasonIndex).toString();
        t.textContent = seasons[seasonForItem].items[Math.floor(Math.random() * seasons[seasonForItem].items.length)];
        pts = 1;
    }

    t.onclick = () => {
        playSound(sound);
        if (t.dataset.correct === "true") {
            combo++;
            score += pts * combo;
        } else {
            combo = 0;
            score += pts; // 負分或錯季 -1
        }
        scoreSpan.textContent = score;
        comboSpan.textContent = combo;
        t.remove();
    };

    gameArea.appendChild(t);
    randomPos(t);
    setTimeout(() => t.remove(), 1600);
}

/* 顯示季節 */
function showSeason() {
    const s = seasons[seasonIndex];
    title.textContent = s.name;
    document.body.style.background = s.bg;
    gameArea.innerHTML = "";
    timeLeft = 10;
    timeSpan.textContent = timeLeft;
}

/* 換季 */
function nextSeason() {
    seasonIndex++;
    if (seasonIndex >= seasons.length) {
        alert("🎉 四季結束！\n你的總分是：" + score);
        seasonIndex = 0;
        score = 0;
        combo = 0;
        scoreSpan.textContent = 0;
        comboSpan.textContent = 0;
    }
    showSeason();
}

/* 空白鍵開始遊戲 */
document.addEventListener("keydown", e => {
    if (!gameStarted && e.code === "Space") {
        gameStarted = true;
        startMsg.style.display = "none";
        showSeason();
    }
});

/* 主節奏 */
setInterval(createTarget, 500);

/* 倒數計時 */
setInterval(() => {
    if (!gameStarted) return;
    timeLeft--;
    timeSpan.textContent = timeLeft;
    if (timeLeft <= 0) nextSeason();
}, 1000);

showSeason();
</script>
</body>
</html>
